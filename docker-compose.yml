services:
  humiditycontrol:
    image: qqrtos/humiditycontrol:latest
    container_name: humiditycontrol
    restart: always
    stop_grace_period: 10s      # time to switch the pump off and save the open minute
    logging:                    # keep logs bounded on the SD card
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:8080"               # http://atelier over Tailscale
    devices:
      - /dev/i2c-1:/dev/i2c-1   # enable I²C first (raspi-config)
      # The pump relay. On current Pi 5 kernels the header pins are on
      # gpiochip0 (labelled pinctrl-rp1); older kernels used gpiochip4.
      - /dev/gpiochip0:/dev/gpiochip0
    volumes:
      - ./data:/data            # database, photos and backups
    environment:
      - SENSOR=sht4x            # sht4x (SHT40/41/45) or sht3x (SHT31)
      - SENSOR_ADDRS=0x44       # comma-separated, e.g. 0x44,0x45
      # The pump: leave "none" until the relay is wired. Then set gpio, the
      # relay's BCM pin and its polarity, and try "Run 1 s" before setting a
      # target.
      - PUMP=none
      # - PUMP=gpio
      # - PUMP_PIN=17           # BCM GPIO17 = physical pin 11
      # PUMP_ACTIVE_LOW has no default on purpose: a wrong guess runs the
      # pump while the app shows it off. Most cheap relay boards switch on
      # when their input is low (true). Check with "Run 1 s".
      # - PUMP_ACTIVE_LOW=true
      # - PUMP_PULSE=10s
      # - PUMP_REST=3m
      # - PUMP_MAX_RH=95
