services:
  gateway:
    image: qqrtos/atelier-gateway:latest
    container_name: gateway
    restart: always
    logging:                    # keep logs bounded on the SD card
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Only this machine can reach it. `tailscale serve` (see
      # docs/deployment.md) is the way in, so the local network has no access.
      - "127.0.0.1:8080:80"

  glaze:
    image: qqrtos/glaze:latest
    container_name: glaze
    restart: always
    logging:                    # keep logs bounded on the SD card
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/glaze:/data      # database, photos and backups

  backup:
    image: qqrtos/atelier-backup:latest
    container_name: backup
    restart: always
    init: true                  # so a stop or restart doesn't wait for a timeout
    logging:                    # keep logs bounded on the SD card
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:                   # the R2 token; see docs/deployment.md
      - path: backup.env
        required: false         # other services can deploy before this is set up
    volumes:
      - ./data:/data:ro         # read-only: it can never change what it backs up

  humiditycontrol:
    image: qqrtos/humiditycontrol:latest
    container_name: humiditycontrol
    restart: always
    stop_grace_period: 10s      # time to switch the pump off and save the open minute
    logging:                    # keep logs bounded on the SD card
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    devices:
      - /dev/i2c-1:/dev/i2c-1   # enable I²C first: sudo raspi-config nonint do_i2c 0
      # The pump relay. On current Pi 5 kernels the header pins are on
      # gpiochip0 (labelled pinctrl-rp1); older kernels used gpiochip4.
      - /dev/gpiochip0:/dev/gpiochip0
      # The small screen (SCREEN=st7789). Enable SPI first (raspi-config →
      # Interface Options → SPI), then uncomment: the container won't start
      # if this device doesn't exist.
      # - /dev/spidev0.0:/dev/spidev0.0
    volumes:
      - ./data/humidity:/data   # database, photos and backups
    environment:
      - SENSOR=sht4x            # sht4x (SHT40/41/45) or sht3x (SHT31)
      - SENSOR_ADDRS=0x44       # comma-separated, e.g. 0x44,0x45
      # The pump: leave "none" until the relay is wired. Then set gpio, the
      # relay's BCM pin and its polarity, and try "Run 1 s" before setting a
      # target.
      - PUMP=none
      # - PUMP=gpio
      # - PUMP_PIN=17           # BCM GPIO17 = physical pin 11
      # PUMP_ACTIVE_LOW has no default on purpose: a wrong guess runs the
      # pump while the app shows it off. Most cheap relay boards switch on
      # when their input is low (true). Check with "Run 1 s".
      # - PUMP_ACTIVE_LOW=true
      # - PUMP_PULSE=10s
      # - PUMP_REST=3m
      # - PUMP_MAX_RH=95
      # The 1.9" ST7789 screen next to the Pi: humidity and temperature.
      # Wiring (BCM numbers) is in docs/apps/humidity/hardware.md; these are
      # the defaults.
      - SCREEN=none             # none | st7789
      # - SCREEN_DC=25
      # - SCREEN_RST=27
      # - SCREEN_BL=18
      # - SCREEN_FLIP=false     # true if it's mounted upside down
